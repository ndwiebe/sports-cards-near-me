name: site
# ⚠️ This file must stay in sync with the copy on `main`. The publish-to-Pages job
# only runs when the triggering ref is `main` (see deploy-github-pages below), and
# GitHub resolves a workflow's own definition — including its env var wiring — from
# whichever ref the run was dispatched against, not from wherever `checkout` later
# pulls actual site code from. Confirmed 2026-08-28: PUBLIC_CLICK_TRACKER_URL was
# added here and worked on `redesign`, but production silently never requested it
# because `main`'s copy of this file predated the line. `checkout` below still
# correctly pulls page code from `redesign` — it's specifically new env vars /
# job-level changes made HERE that need a second push to `main` to actually reach
# production. See CLAUDE.md → "the three things that will burn you".
permissions:
  contents: read
  pages: write
  id-token: write
on:
  push:
    branches: [redesign]
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: redesign
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run bake
      - run: npm run bake:shows
      - run: npm run bake:resellers
      - run: npm test
      - run: npm run build
        env:
          PUBLIC_MAPBOX_TOKEN: ${{ secrets.PUBLIC_MAPBOX_TOKEN }}
          # Search Console ownership token. Not a secret — Google's HTML-tag method
          # publishes this value in the page source by design, so it lives in the
          # workflow rather than in repo secrets. Removing it un-verifies the property.
          PUBLIC_GSC_VERIFICATION: oqigACqbn4bKdAfTZBv3_Bw9Wg3vo7HSk6IXml4riks
          # Cloudflare Web Analytics beacon token — also public by design (it ships in
          # the beacon script tag). Set as a repo variable once the site is added at
          # dash.cloudflare.com > Web Analytics; unset means no beacon is emitted.
          PUBLIC_CF_ANALYTICS_TOKEN: ${{ vars.PUBLIC_CF_ANALYTICS_TOKEN }}
          # GA4 measurement ID (G-XXXXXXXXXX), public by design. Opt-in: GA4 sets
          # cookies, so leaving this unset also avoids a consent-banner obligation.
          PUBLIC_GA4_ID: ${{ vars.PUBLIC_GA4_ID }}
          # Click-counter Worker endpoint. Public by design (it ships in the page as
          # a sendBeacon target). Without this the Worker can be deployed and running
          # and the site still sends it nothing — the build simply omits the listener.
          # Set as a repo variable to the URL that deploy-click-tracker.yml prints.
          PUBLIC_CLICK_TRACKER_URL: ${{ vars.PUBLIC_CLICK_TRACKER_URL }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: 'true'
      - name: Deploy to Cloudflare Pages
        if: ${{ github.event_name != 'pull_request' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=sportscardsnearme --branch=${{ github.ref_name }}
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy-github-pages:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
