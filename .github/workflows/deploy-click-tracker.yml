name: deploy-click-tracker

# Deploys the click-counting Worker (worker/click-tracker.js). Manual only — this
# provisions real Cloudflare infrastructure (a KV namespace) the first time it runs,
# which isn't something to trigger on every push. Re-run any time the Worker code
# changes.

on:
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Pinned to redesign regardless of which ref this workflow_dispatch is fired
      # against: the workflow FILE has to live on main to be visible/runnable at all
      # (GitHub requires this for workflow_dispatch — see SESSIONS.md), but
      # worker/click-tracker.js and worker/wrangler.jsonc only exist on redesign.
      # Without this, a run dispatched from main's copy checks out main and the
      # later "Deploy the Worker" step fails with no worker/ directory.
      - uses: actions/checkout@v4
        with:
          ref: redesign
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Find or create the KV namespace
        id: kv
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler kv namespace list > /tmp/kv-list.json
          # 2026-08-28: bare `wrangler kv namespace create CLICKS` (no --config,
          # no project context) titles the namespace exactly "CLICKS", not
          # "<worker-name>-CLICKS" as an earlier version of this script assumed.
          # Confirmed against a real create run. Matching on the exact title we
          # know wrangler actually used, not a guessed convention. Collision risk:
          # if this Cloudflare account ever hosts an unrelated namespace also
          # bare-titled "CLICKS", this would misidentify it — acceptable for now,
          # revisit if that ever happens.
          ID=$(node -e "
            const list = require('/tmp/kv-list.json');
            const found = list.find(ns => ns.title === 'CLICKS');
            if (found) console.log(found.id);
          ")
          if [ -z "$ID" ]; then
            echo "No existing namespace found — creating one."
            npx wrangler kv namespace create CLICKS > /tmp/kv-create.txt
            cat /tmp/kv-create.txt
            # 2026-08-28: wrangler's real create output is `"id": "<32 hex>"`
            # (JSON-shaped, colon) — the earlier `id = "..."` (space-equals)
            # pattern never matched, so a namespace was created successfully
            # every time and the step still failed right after, believing it
            # had nothing. Verified against the actual failing run's log.
            ID=$(grep -o '"id": *"[a-f0-9]*"' /tmp/kv-create.txt | grep -o '[a-f0-9]\{32\}')
          fi
          if [ -z "$ID" ]; then
            echo "::error::Could not determine a KV namespace id — see the output above."
            exit 1
          fi
          echo "KV namespace id: $ID"
          echo "id=$ID" >> "$GITHUB_OUTPUT"

      - name: Generate the real wrangler config
        run: |
          sed "s/__KV_ID__/${{ steps.kv.outputs.id }}/" worker/wrangler.jsonc > worker/wrangler.generated.jsonc
          cat worker/wrangler.generated.jsonc

      - name: Deploy the Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy -c wrangler.generated.jsonc

      - name: Summarise
        run: |
          {
            echo "### Click tracker deployed"
            echo ""
            echo "KV namespace: \`${{ steps.kv.outputs.id }}\`"
            echo ""
            echo "Read counts with:"
            echo '```'
            echo "npx wrangler kv key list --namespace-id=${{ steps.kv.outputs.id }} --prefix=clicks:"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
