name: ratings-refresh

# Pulls fresh Google ratings for the directory once a month and opens a PR with
# the result. Deliberately does NOT write to the sheet or the site: the sheet is
# the source of truth and Text Search genuinely mis-matches sometimes (it once
# put a shop with no public street address at an unrelated address in another
# city). A PR keeps a human in the loop on exactly the step that needs one.
#
# Cost: one Place Details call per store, ~615 today, against a free monthly
# allowance of 5,000-10,000 per SKU. A full refresh is free; the script's own
# MAX_CALLS=800 is a second backstop.

on:
  schedule:
    # 06:00 UTC on the 1st — well clear of the daily 09:00 site rebuild.
    - cron: '0 6 1 * *'
  workflow_dispatch:
    inputs:
      all:
        description: 'Refresh every store, not just unrated ones'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: redesign

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Rebuild stores.json from the sheet first, so the refresh runs against
      # what is actually live rather than whatever was committed last.
      - run: npm run bake

      - name: Refresh ratings
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: |
          if [ -z "$GOOGLE_PLACES_API_KEY" ]; then
            echo "::error::GOOGLE_PLACES_API_KEY is not set — refusing to run silently."
            exit 1
          fi
          if [ "${{ inputs.all }}" = "true" ]; then
            python3 scripts/refresh-ratings.py --all
          else
            python3 scripts/refresh-ratings.py
          fi

      - name: Summarise
        run: |
          {
            echo "### Ratings refresh"
            echo ""
            if [ -f docs/research/ratings-refresh.csv ]; then
              echo "- matched: $(($(wc -l < docs/research/ratings-refresh.csv) - 1))"
            fi
            if [ -f docs/research/ratings-refresh-unmatched.csv ]; then
              echo "- unmatched: $(($(wc -l < docs/research/ratings-refresh-unmatched.csv) - 1))"
            fi
            echo ""
            echo "Spot-check the \`Google address\` column against each shop's own address before importing —"
            echo "Text Search can match a nearby business of a similar name."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open a PR with the results
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/ratings-refresh
          base: redesign
          commit-message: 'chore: monthly ratings refresh'
          title: 'Monthly ratings refresh'
          body: |
            Automated monthly pull of Google ratings for the directory.

            **This is not ready to merge as-is.** The CSVs attached here are a
            proposal, not verified data. Before importing anything into the sheet,
            check the `Google address` column against each shop's own address —
            Text Search matches by name and can land on a different business.

            Rows whose address does not corroborate should be left unrated. An
            empty rating is a gap; a wrong rating on a named local business is a
            problem for that shop.
          add-paths: |
            docs/research/ratings-refresh.csv
            docs/research/ratings-refresh-unmatched.csv
